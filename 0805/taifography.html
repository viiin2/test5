<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 모든 html의 head에 반드시 포함 뷰포트 너비를 기기 너비에 맞춤 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .mq-basic {
        background-color: blue;
        color: white;
        padding: 15px;
        text-align: center;
      }
      @media screen and (min-width: 480px) {
        .mq-basic {
          background-color: lightgreen;
          color: white;
          padding: 15px;
          text-align: center;
          /* 얘넨 밑에작성해줘야함 */
        }
      }
      .mq-max {
        background-color: rgb(255, 149, 0);
        color: white;
        padding: 15px;
        text-align: center;
      }
      @media screen and (max-width: 480px) {
        .mq-max {
          background-color: rgb(7, 90, 7);
          color: white;
          padding: 15px;
          text-align: center;
        }
        /* 얘넨 밑에작성해줘야함 */
      }
    </style>
  </head>
  <body>
    <section>
      <h2>섹션2. media 기본 mid-width</h2>
      <div class="basic mq-basic">
        창 너비 480px이상이면 연두색, 미만이면 하늘색
      </div>
    </section>
    <section>
      <h2>섹션3. media 기본 max</h2>
      <div class="mq-max">창 너비 480px이하 주황색, 초과면 초록색</div>
    </section>
  </body>
</html>
