<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .s13-frame {
        height: 140px;
        overflow: auto;
        border: 1px solid black;
        margin-bottom: 10px;
        background-color: aliceblue;
        background-image: url("다운로드.jpeg");
        background-repeat: no-repeat;
        background-position: center 10px;
      }
      .s13-lacal {
        background-attachment: local;
      }
      .s14-base {
        height: 150px;
        border: 1px solid black;
        background-color: aliceblue;
        background-image: url("다운로드.jpeg");
        background-repeat: no-repeat;
        background-position: center 10px;
      }
      /* 비율유지 요소를 빈틈없이 덮음 */
      .s14-cover {
        background-size: cover;
      }
      /* 비율유지 요소 안에 전부 보이게 */
      .s14-contain {
        background-size: contain;
      }
      /* 가로 세로를 강제로 지정{이미지가 찌그러질수도있음) */
      .s14-px {
        background-size: 200px 40px;
      }
    </style>
  </head>
  <body>
    <section>
      <div class="s13-frmae">
        <p>내용1</p>
        <p>내용2</p>
        <p>내용3</p>
        <p>내용4</p>
        <p>내용5</p>
        <p>내용6</p>
        <p>내용7</p>
        <p>내용8</p>
        <p>내용8</p>
      </div>
      <div class="s13-frame s13-local">
        <p>내용1</p>
        <p>내용2</p>
        <p>내용3</p>
        <p>내용4</p>
        <p>내용5</p>
        <p>내용6</p>
        <p>내용7</p>
        <p>내용8</p>
        <p>내용8</p>
      </div>
    </section>
    <section>
      <p>cover-빈틈없이덮음</p>
      <div class="s14-base s14-cover"></div>
      <p>contain-전부 보이게</p>
      <div class="s14-base s14-contain"></div>
      <p>200px 40px</p>
      <div class="s14-base s14-px"></div>
    </section>
  </body>
</html>
