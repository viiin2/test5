<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 모든 html의 head에 반드시 포함 뷰포트 너비를 기기 너비에 맞춤 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .mq-basic {
        background-color: rgb(24, 173, 64);
        color: white;
        padding: 15px;
        text-align: center;
      }
      @media screen and (min-width: 768px) {
        .mq-basic {
          background-color: rgb(211, 238, 144);
          color: white;
          padding: 15px;
          text-align: center;
          /* 얘넨 밑에작성해줘야함 */
        }
      }
      @media screen and (min-width: 1025px) {
        .mq-basic {
          background-color: rgb(16, 63, 123);
          color: white;
          padding: 15px;
          text-align: center;
          /* 얘넨 밑에작성해줘야함 */
        }
      }
    </style>
  </head>
  <body>
    <section>
      <!-- 768미만이면 초록 ~1024이하 노랑 ~파랑 -->
      <h2>섹션</h2>
      <div class="basic mq-basic">768미만이면 초록 ~1024이하 노랑 ~파랑</div>
    </section>
  </body>
</html>
