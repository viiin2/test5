<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>폰트 적용 실습</title>

    <!-- 구글 폰트 불러오기 (하나의 링크로 통합) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Libertinus+Serif:ital,wght@0,400;0,700;1,400&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* 눈누 폰트 예시 (@font-face 방식) */
      @font-face {
        font-family: "Pretendard-Regular";
        src: url("https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff")
          format("woff");
        font-weight: 400;
      }

      /* 기본 폰트 설정 (기본값) */
      body {
        font-family: "Open Sans", sans-serif;
      }

      /* 클래스별로 각각 다른 폰트 지정 */
      .font-bitcount {
        font-family: "Bitcount Prop Single", system-ui;
      }

      .font-libertinus {
        font-family: "Libertinus Serif", serif;
      }

      .font-opensans {
        font-family: "Open Sans", sans-serif;
      }

      .font-noonnu {
        font-family: "Pretendard-Regular", sans-serif;
      }

      /* 우선순위(구글 -> 눈누 -> 글꼴계열)를 적용한 클래스 */
      .font-fallback {
        font-family: "Bitcount Prop Single", "Pretendard-Regular", sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- class 속성을 사용해 각각 원하는 폰트 적용 -->
    <h1 class="font-bitcount">Bitcount Prop Single 적용 텍스트</h1>
    <p class="font-libertinus">Libertinus Serif 적용 텍스트</p>
    <p class="font-opensans">Open Sans 적용 텍스트</p>
    <p class="font-noonnu">눈누 프리텐다드 폰트 적용 텍스트</p>

    <hr />

    <!-- 실습: 우선순위 적용 (구글 -> 눈누 -> 기본) -->
    <p class="font-fallback">우선순위 테스트 (Bitcount → 눈누 → sans-serif)</p>
  </body>
</html>
