<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      section {
        border-bottom: 1px dashed #ccc;
        padding: 12px;
      }

      body {
        font-family: sans-serif;
      }

      .action-btn:hover {
        background-color: gold;
      }

      .action-btn:active {
        background-color: crimson;
        color: white;
      }

      .action-input:focus {
        background-color: lightyellow;
      }
    </style>
  </head>
  <body>
    <section>
      <button class="action-btn">올려보고 눌러보세요</button>
      <input placeholder="클릭(포커스)해 보세요" class="actio-input" />
    </section>
  </body>
</html>
