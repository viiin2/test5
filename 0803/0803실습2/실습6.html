<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>실습6 - box-sizing 크기 비교</title>
    <style>
      /* 두 박스에 들어가는 공통 스타일 */
      .box {
        width: 100px;
        height: 100px;
        padding: 20px;
        border: 15px solid red;
        background-color: orange;
        margin: 20px;
        font-weight: bold;
      }

      /* 1. content-box (기본값): width/height가 '순수 내용 영역'만의 크기가 됨 */
      .content-box {
        box-sizing: content-box;
      }

      /* 2. border-box: width/height 안에 padding과 border가 모두 포함됨 */
      .border-box {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="box content-box">content-box</div>
    <div class="box border-box">border-box</div>
  </body>
</html>
