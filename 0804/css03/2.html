<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 100px;
        height: 100px;

        padding: 20px;
        border: 15px solid red;
        background-color: orange;
      }
      .borderbox {
        box-sizing: border-box;
      }
      .contentbox {
        box-sizing: content-box;
      }
    </style>
  </head>
  <body>
    <div class="borderbox">boderbox</div>
    <br />
    <div class="contentbox">centerbox</div>
  </body>
</html>
