<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 200px;
        height: 200px;
        background-color: blue;
      }
      .opc:hover {
        opacity: -0;
      }
      .vib:hover {
        visibility: hidden;
      }
      .dis:hover {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="opc">opacity</div>
    <br />
    <div class="vib">visibility</div>
    <br />
    <div class="dis">display</div>
  </body>
</html>
