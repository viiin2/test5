<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- div(division):여러 요소를 블록 단위로 묶는 범용 컨테이너 -->
    <div>
      <p>css 스타일 적용이나 javascript요소 선택을 위한 묶음입니다.</p>
    </div>
    <header>header- 로고나 메뉴가 들어가는 상단 영역</header>
    <nav>
      nav-이동 링크 모음:
      <a href="#">홈</a>
    </nav>

    <main>
      <!-- main 핵심 콘텐츠 한페이지에 한번만, 중첩금지 -->
      <section>
        <!-- section: article들의 그룹/article:독립적으로 의미가 완성되는 한 덩어리 -->
      </section>
      <article>
        <p>article 하나가 그 자체로 하나의 글이 딥니다</p>
      </article>
      <aside>본문과 직접 연관 없는 옆 영역</aside>
    </main>
    <footer>저작권 연락처가 들어가는 하단영역</footer>
    <!-- 시멘틱 태그가 자동으로 디자인을 입히는 않음 구조는 html 표현 css -->
  </body>
</html>
